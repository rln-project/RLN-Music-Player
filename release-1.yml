# Builds signed release APKs and attaches them to a GitHub release, either
# when a tag like v0.2.0 is pushed, or when main has a versionName (in
# app/build.gradle.kts) that has no release yet: bump the version, merge to
# main, and the release follows.
#
# Publishing requires the RLN signing secrets and certificate fingerprint:
#   RLN_KEYSTORE_BASE64   the keystore file, base64-encoded
#   RLN_KEYSTORE_PASSWORD
#   RLN_KEY_ALIAS
#   RLN_KEY_PASSWORD
#   RLN_SIGNING_CERT_SHA256   SHA-256 fingerprint of the release certificate
# Missing signing material stops the release; debug-signed APKs are never published.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Merge-only commits can keep validation running without publishing.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          mkdir source
          tar -xzf RLN-Music-Player-source.tar.gz -C source

      # Which release this is, and whether it already exists (then the rest is skipped).
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' source/app/build.gradle.kts | head -n 1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.skip != 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Keystore
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RLN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo '::error::Official release signing key is required.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RLN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        if: steps.version.outputs.skip != 'true'
        working-directory: source
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
          RLN_KEYSTORE_PASSWORD: ${{ secrets.RLN_KEYSTORE_PASSWORD }}
          RLN_KEY_ALIAS: ${{ secrets.RLN_KEY_ALIAS }}
          RLN_KEY_PASSWORD: ${{ secrets.RLN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify official APK signing identity and version
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RLN_SIGNING_CERT_SHA256: ${{ vars.RLN_SIGNING_CERT_SHA256 || secrets.RLN_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected="$RLN_SIGNING_CERT_SHA256"
          test -n "$expected" || { echo '::error::RLN_SIGNING_CERT_SHA256 must match the RLN release key.'; exit 1; }
          expected=$(printf '%s' "$expected" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for apk in source/app/build/outputs/apk/release/*.apk; do
            certificate="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")"
            actual=$(printf '%s\n' "$certificate" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test "$actual" = "$expected" || { echo "::error::Unexpected signing certificate for $apk"; exit 1; }
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1p' > "$RUNNER_TEMP/apk-version.txt"
            grep -F "versionName='${TAG#v}'" "$RUNNER_TEMP/apk-version.txt"
          done

      - name: Name the APKs
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          for f in source/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/RLN-Music-Player-${TAG}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # From main this also creates the tag, on the commit that was built.
        run: |
          if [ -f "source/docs/releases/${TAG#v}.md" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "RLN Music Player $TAG" --notes-file "source/docs/releases/${TAG#v}.md"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "RLN Music Player $TAG" --generate-notes
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
