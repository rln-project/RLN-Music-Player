name: Validate signed RLN Global 1.2.0 build 52

on:
  push:
    branches: [feature/rln-1.2.0-diagnostics]
    paths: [RLN-Music-Player-source.tar.gz, .github/workflows/validate-diagnostics-52.yml]

permissions:
  contents: read
  actions: read

jobs:
  global:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PACKAGE_NAME: com.rln.musicplayer
      CERT_SHA256: 43f8d1591f70239277bc7374bd0b80c693829a251fac9e3a00d5e12d5d274467
      APK_52: source/app/build/outputs/apk/release/app-universal-release.apk
      APK_51: baseline/RLN-Music-Player-Global-v1.1.0-build51.apk
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and record provenance
        run: |
          mkdir source
          tar -xzf RLN-Music-Player-source.tar.gz -C source
          sha256sum RLN-Music-Player-source.tar.gz
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1 emulator system-images;android-35;google_apis;x86_64
      - name: Check the SDK used by the build
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager --list_installed
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Start the upgrade test emulator
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          avdmanager create avd --name rln-upgrade --package 'system-images;android-35;google_apis;x86_64' </dev/null
          log="$RUNNER_TEMP/emulator.log"
          nohup "$ANDROID_HOME/emulator/emulator" -avd rln-upgrade -port 5554 -accel on -no-window -noaudio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader > "$log" 2>&1 </dev/null &
          emulator_pid=$!
          trap 'status=$?; if (( status != 0 )); then tail -100 "$log" || true; fi' EXIT
          adb start-server
          for attempt in {1..100}; do
            kill -0 "$emulator_pid"
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 3
          done
          adb devices -l
          exit 1
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all JVM tests
        working-directory: source
        run: |
          # AGP's host tests reuse the app manifest. Provide Compose's test
          # activity for the release-flavoured tests in this invocation only.
          cat > "$RUNNER_TEMP/compose-host-tests.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              if (project.path == ':app') {
                  project.pluginManager.withPlugin('com.android.application') {
                      project.dependencies.add('releaseImplementation', 'androidx.compose.ui:ui-test-manifest')
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon --init-script "$RUNNER_TEMP/compose-host-tests.gradle" :core:test :app:test
      - name: Build signed Global APK
        working-directory: source
        env:
          KEYSTORE_BASE64: ${{ secrets.RLN_KEYSTORE_BASE64 }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
          RLN_KEYSTORE_PASSWORD: ${{ secrets.RLN_KEYSTORE_PASSWORD }}
          RLN_KEY_ALIAS: ${{ secrets.RLN_KEY_ALIAS }}
          RLN_KEY_PASSWORD: ${{ secrets.RLN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          export RLN_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RLN_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RLN_KEYSTORE"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon :app:assembleRelease
      - name: Download and verify the Global build 51 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/14775682648/zip > "$RUNNER_TEMP/global-51.zip"
          echo "7a47201fc2e4e9c3147004b6433e857ccbf35f685c9f09cb212eff08f0556b5a  $RUNNER_TEMP/global-51.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/global-51.zip" -d baseline
          (cd baseline && sha256sum -c SHA256SUMS.txt)
      - name: Compare signatures, package, versions and SDK levels
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for apk in "$APK_51" "$APK_52"; do
            cert=$("$tools/apksigner" verify --verbose --print-certs -Werr "$apk")
            printf '%s\n' "$cert"
            test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$cert")" = "$CERT_SHA256"
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/$(basename "$apk").txt"
          done
          old="$RUNNER_TEMP/$(basename "$APK_51").txt"
          new="$RUNNER_TEMP/$(basename "$APK_52").txt"
          grep -F "package: name='$PACKAGE_NAME' versionCode='51' versionName='1.1.0'" "$old"
          grep -F "package: name='$PACKAGE_NAME' versionCode='52' versionName='1.2.0'" "$new"
          grep -F "compileSdkVersion='37'" "$new"
          grep -Fx "sdkVersion:'26'" "$new"
          grep -Fx "targetSdkVersion:'36'" "$new"
          "$tools/aapt" dump xmltree "$APK_52" AndroidManifest.xml > "$RUNNER_TEMP/release-manifest.txt"
          if grep -Fq 'androidx.activity.ComponentActivity' "$RUNNER_TEMP/release-manifest.txt"; then
            echo "Compose test activity must not be packaged in the signed APK" >&2
            exit 1
          fi
          diff <(grep -E '^(sdkVersion|targetSdkVersion):' "$old") <(grep -E '^(sdkVersion|targetSdkVersion):' "$new")
          unzip -Z1 "$APK_52" > "$RUNNER_TEMP/apk-entries.txt"
          actual=$(awk -F/ '$1 == "lib" && NF == 3 && $3 ~ /\.so$/ {print $2}' "$RUNNER_TEMP/apk-entries.txt" | LC_ALL=C sort -u)
          expected=$(printf '%s\n' arm64-v8a armeabi-v7a x86 x86_64)
          test "$actual" = "$expected"
          while IFS= read -r abi; do
            for library in libopentune_audio.so libquickjs.so; do
              grep -Fx "lib/$abi/$library" "$RUNNER_TEMP/apk-entries.txt"
            done
          done <<< "$expected"
      - name: Install build 51 and update in place to build 52
        run: |
          set -euo pipefail
          trap 'status=$?; if (( status != 0 )); then adb logcat -d -s AndroidRuntime:E | tail -80 || true; fi' EXIT
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb install "$APK_51"
          adb shell dumpsys package "$PACKAGE_NAME" > "$RUNNER_TEMP/package-51.txt"
          grep -E 'versionCode=51([[:space:]]|$)' "$RUNNER_TEMP/package-51.txt"
          adb install -r "$APK_52"
          adb shell dumpsys package "$PACKAGE_NAME" > "$RUNNER_TEMP/package-52.txt"
          grep -E 'versionCode=52([[:space:]]|$)' "$RUNNER_TEMP/package-52.txt"
          grep -F 'versionName=1.2.0' "$RUNNER_TEMP/package-52.txt"
          previous=$(grep -m1 'firstInstallTime=' "$RUNNER_TEMP/package-51.txt")
          current=$(grep -m1 'firstInstallTime=' "$RUNNER_TEMP/package-52.txt")
          test "$previous" = "$current"
          adb shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
          sleep 8
          adb shell pidof "$PACKAGE_NAME"
      - name: Package verified artifact
        run: |
          mkdir dist
          cp "$APK_52" dist/RLN-Music-Player-Global-v1.2.0-build52.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RLN-Music-Player-Global-v1.2.0-build52
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Stop the test emulator
        if: always()
        run: adb emu kill || true
