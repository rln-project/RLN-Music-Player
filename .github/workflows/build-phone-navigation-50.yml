name: Build phone navigation preview
on:
  push:
    branches: [build/phone-navigation-50-verified]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source
        run: |
          test "$(git hash-object RLN-Music-Player-source.tar.gz)" = a342f9f6828348da2b80477f80596010f1bcc18b
          mkdir source
          tar -xzf RLN-Music-Player-source.tar.gz -C source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RLN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RLN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Compile and sign APK
        working-directory: source
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
          RLN_KEYSTORE_PASSWORD: ${{ secrets.RLN_KEYSTORE_PASSWORD }}
          RLN_KEY_ALIAS: ${{ secrets.RLN_KEY_ALIAS }}
          RLN_KEY_PASSWORD: ${{ secrets.RLN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature and build number
        env:
          RLN_SIGNING_CERT_SHA256: ${{ vars.RLN_SIGNING_CERT_SHA256 || secrets.RLN_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=source/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          expected=$(printf '%s' "$RLN_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          cert=$("$tools/apksigner" verify --print-certs "$apk")
          actual=$(printf '%s\n' "$cert" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = "$expected"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.rln.musicplayer' versionCode='50' versionName='1.1.0'" "$RUNNER_TEMP/badging.txt"
          mkdir dist
          cp "$apk" dist/RLN-Music-Player-v1.1.0-build50-arm64-v8a.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RLN-Music-Player-build50-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
